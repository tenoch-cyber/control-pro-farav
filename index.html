/* ---------- Cálculos ---------- */
const mantTot = r => num(r.cantidad || 1) * num(r.precio);

const enCamino = () => live('viajes').filter(v => st(v) === 'camino').sort((a, b) => num(a.createdAt || a.updatedAt) - num(b.createdAt || b.updatedAt));
const porCobrar = () => enCamino().reduce((a, v) => a + num(v.pedido) + num(v.costo), 0);
function split(c, r) { const t = recTot(c, r); if (r.pago === 'mixto' && r.montos) return { efectivo: num(r.montos.efectivo), transferencia: num(r.montos.transferencia), tarjeta: num(r.montos.tarjeta) }; if (K3.includes(r.pago)) { const o = { efectivo: 0, transferencia: 0, tarjeta: 0 }; o[r.pago] = t; return o; } return null; }
function sumDay(rows, gl = 0) { let p = 0, ing = 0, cc = 0, tip = 0, gas = 0, perd = 0, ade = 0; for (const v of rows) { const s = st(v); if (hasPed(v) && !isG(v)) ade += num(v.pedido); if (s === 'camino') continue; if (s === 'cancelado') { perd += num(v.pedido); continue; } if (isG(v)) { gas += num(v.costo); continue; } p++; ing += num(v.costo); cc += ccOf(v); tip += num(v.tips); const d = difOf(v); if (d < 0) perd += -d; else tip += d; } const real = ing + tip - gas - gl - perd; return { p, ing, cc, tip, gas, gl, perd, ade, real, neta: real - cc }; }
const gasOn = f => live('gasolina').filter(g => g.fecha === f).reduce((a, g) => a + num(g.importe), 0);
const inR = (f, a, b) => f >= a && f <= b;
function rangeOf(per) { const t = today(); if (per === 'mes') return [t.slice(0, 8) + '01', t]; if (per === 'todo') return ['0000', '9999']; return [weekStart(t), t]; }
function sumRange(a, b) { const v = live('viajes').filter(r => r.fecha && inR(r.fecha, a, b)); const gl = live('gasolina').filter(r => r.fecha && inR(r.fecha, a, b)).reduce((s, r) => s + num(r.importe), 0); return { ...sumDay(v, gl), rows: v }; }
function cobros(rows) { const c = { efectivo: 0, transferencia: 0, tarjeta: 0, sin: 0 }; for (const v of rows) { if (isG(v) || !done(v)) continue; const s = split('viajes', v); if (s) K3.forEach(k => c[k] += s[k]); else c.sin += recTot('viajes', v); } return c; }
const ccGen = () => live('viajes').reduce((a, v) => a + (isG(v) || !done(v) ? 0 : ccOf(v)), 0);
const ccPagado = () => live('pagoscc').reduce((a, g) => a + num(g.monto), 0);
const ccPend = () => ccGen() - ccPagado();
const fondoOf = d => { const f = S.fondos[d]; return f && !f.deleted ? num(f.monto) : 0; };

  const z = () => ({ efectivo: 0, transferencia: 0, tarjeta: 0 });

  for (const v of live('viajes').filter(v => v.fecha === d)) { if (hasPed(v) && !isG(v)) { if (K3.includes(v.pedidoPago)) r.ped[v.pedidoPago] += num(v.pedido); else r.sin++; } if (!done(v)) continue; const s = split('viajes', v); if (!s) { r.sin++; continue; } K3.forEach(k => (isG(v) ? r.gst : r.inn)[k] += s[k]); }
  for (const c of ['gasolina', 'mant', 'pagoscc']) for (const g of live(c).filter(g => g.fecha === d)) { const s = split(c, g); if (!s) { r.sin++; continue; } K3.forEach(k => (c === 'gasolina' ? r.gas : c === 'pagoscc' ? r.ccp : r.gst)[k] += s[k]); }

function gasRows() { const r = live('gasolina').sort((a, b) => num(a.km) - num(b.km) || String(a.fecha).localeCompare(b.fecha)); return r.map((g, i) => { const kmr = i ? num(g.km) - num(r[i - 1].km) : null; return { ...g, kmr, rend: kmr && num(g.litros) ? kmr / num(g.litros) : null, cpk: kmr ? num(g.importe) / kmr : null }; }); }
const odo = () => live('gasolina').concat(live('mant')).reduce((m, r) => Math.max(m, num(r.km)), 0);

const daysTo = f => Math.round((new Date(f + 'T12:00') - new Date(today() + 'T12:00')) / 864e5);
const vencTxt = r => { const d = daysTo(r.fecha); return d < 0 ? ['Vencido hace ' + (-d) + (d === -1 ? ' día' : ' días'), 'var(--bad)', 'var(--badbg)'] : d === 0 ? ['Vence hoy', 'var(--bad)', 'var(--badbg)'] : d <= 30 ? ['Vence en ' + d + (d === 1 ? ' día' : ' días'), 'var(--amb)', 'var(--ambbg)'] : ['Vence el ' + fdate(r.fecha, { day: 'numeric', month: 'short', year: 'numeric' }), 'var(--mute)', 'var(--seg)']; };
const vencList = () => live('venc').filter(r => r.fecha).sort((a, b) => a.fecha.localeCompare(b.fecha));
function alerts() { const o = odo(), t = today(), out = []; for (const v of vencList()) { const d = daysTo(v.fecha); if (d <= 15) out.push(`\u0001${esc(v.nombre || 'Documento')}: ${d < 0 ? 'vencido desde el ' + fdate(v.fecha, { day: 'numeric', month: 'short' }) : d === 0 ? 'vence hoy' : 'vence en ' + d + (d === 1 ? ' día' : ' días')}`); } for (const m of live('mant')) { if (m.proxKm && o && o >= num(m.proxKm) - 300) out.push(`${esc(m.servicio || 'Servicio')}: toca a los ${num(m.proxKm).toLocaleString('es-MX')} km (vas en ${o.toLocaleString('es-MX')})`); if (m.proxFecha && m.proxFecha <= t) out.push(`${esc(m.servicio || 'Servicio')}: fecha programada ${fdate(m.proxFecha)}`); } return [...new Set(out)].map(a => `<div class="alert">${ic(a[0] === '\u0001' ? 'cal' : 'wrench')}<span>${a.replace('\u0001', '')}</span></div>`).join(''); }

function bars() {
  const t = today(); let items = [];
  if (period === 'semana') { const ws = new Date(weekStart() + 'T12:00'); for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); const f = iso(d); items.push({ l: 'LMMJVSD'[i], v: f > t ? 0 : sumDay(live('viajes').filter(v => v.fecha === f), gasOn(f)).real, hi: f === t }); } }
  else if (period === 'mes') { const n = +t.slice(8, 10); for (let i = 1; i <= n; i++) { const f = t.slice(0, 8) + String(i).padStart(2, '0'); items.push({ l: i % 5 === 1 ? String(i) : '', v: sumDay(live('viajes').filter(v => v.fecha === f), gasOn(f)).real, hi: f === t }); } }
  else { const ms = [...new Set(live('viajes').map(v => String(v.fecha).slice(0, 7)))].filter(Boolean).sort().slice(-12); items = ms.map(m => { const r = sumRange(m + '-01', m + '-31'); return { l: fdate(m + '-01', { month: 'short' }).replace('.', ''), v: r.real, hi: m === t.slice(0, 7) }; }); }
  const mx = Math.max(1, ...items.map(i => i.v));
  return `<div class="bars" style="grid-template-columns:repeat(${Math.max(items.length, 1)},minmax(0,1fr))">${items.map(i => `<div><i class="${i.hi ? 'hi' : i.v > 0 ? '' : 'z'}" style="height:${i.v > 0 ? Math.max(5, Math.round(i.v / mx * 92)) : 4}px"></i><span>${esc(i.l)}</span></div>`).join('')}</div>`;
}

const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(display-mode: standalone)').matches;
// Permiso con Google Identity Services (ventanita oficial de Google; no depende del modo de redirección de Firebase)
const GIS_CLIENT = '1050414768123-kvsikfv6irac7h39opojq24ikhh87r9i.apps.googleusercontent.com';
let gisP = null, tokenClient = null;
const gisReady = () => !!(window.google && google.accounts && google.accounts.oauth2);
const loadGIS = () => gisP || (gisP = new Promise((ok, no) => { if (gisReady()) return ok(); const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = () => ok(); s.onerror = () => { gisP = null; no({ code: 'gis-load' }); }; document.head.appendChild(s); }));
function requestToken() {
  return new Promise((ok, no) => {
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GIS_CLIENT, scope: DRIVE_SCOPE, hint: (user && user.email) || '', callback: () => {} });
    tokenClient.callback = r => (r && r.access_token) ? ok(r.access_token) : no({ code: 'gis-' + ((r && r.error) || 'sin-token') });
    tokenClient.error_callback = e => no({ code: 'gis-' + ((e && e.type) || 'error') });
    tokenClient.requestAccessToken({ prompt: '' });
  });
}
async function driveBackup() {
  if (driveBusy) return;
  if (!navigator.onLine) { toast('Necesitas internet para respaldar en Drive'); return; }
  const tok = cachedToken();
  if (tok) return driveUpload(tok);
  if (!gisReady()) { toast('Preparando Google… toca Respaldar otra vez en un momento'); loadGIS().catch(() => toast('No se pudo cargar Google. Revisa tu internet.')); return; }
  try { const t = await requestToken(); keepToken(t); await driveUpload(t); }
  catch (e) { driveErr(e); }
}
function driveErr(e) {
  driveBusy = false; const c = (e && (e.code || e.status)) || '';
  const m = c === 'gis-popup_failed_to_open' ? 'El teléfono bloqueó la ventana de Google. Permite ventanas emergentes e intenta de nuevo.'
    : c === 'gis-popup_closed' ? 'Se cerró la ventana de Google antes de terminar. Intenta de nuevo.'
    : c === 'gis-access_denied' ? 'No se dio permiso para usar Google Drive.'
    : c === 'auth/popup-blocked' ? 'El teléfono bloqueó la ventana de Google. Permite ventanas emergentes para esta app e intenta de nuevo.'
    : c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? 'Se cerró la ventana de Google antes de terminar. Intenta de nuevo.'
    : c === 'auth/user-mismatch' ? 'Elige la misma cuenta de Google con la que entras a la app.'
    : c === 403 && /accessNotConfigured|has not been used|disabled/i.test(e.msg || '') ? 'Falta activar la Google Drive API en Google Cloud.'
    : c === 401 ? 'El permiso de Drive venció. Toca Respaldar otra vez.'
    : 'No se pudo respaldar en Drive (' + (c || 'error') + ').';
  if (c === 401) { try { sessionStorage.removeItem('cp_dtok'); } catch (x) {} }
  toast(m); render();
}
async function gfetch(tok, url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + tok, ...(opt.headers || {}) } });
  if (!r.ok) { let msg = ''; try { msg = JSON.stringify(await r.json()); } catch (e) {} throw { status: r.status, code: r.status, msg }; }
  return r.json();
}
async function driveFolder(tok) {
  const id = bkMeta().driveFolderId;
  if (id) { try { const f = await gfetch(tok, 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?fields=id,trashed'); if (!f.trashed) return id; } catch (e) { if (e.status !== 404) throw e; } }
  const f = await gfetch(tok, 'https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'Respaldos Control Pro', mimeType: 'application/vnd.google-apps.folder' }) });
  return f.id;
}
async function driveFile(tok, folder, name, blob) {
  const meta = new Blob([JSON.stringify({ name, parents: [folder] })], { type: 'application/json' });
  const fd = new FormData(); fd.append('metadata', meta); fd.append('file', blob);
  return gfetch(tok, 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: fd });
}
async function driveUpload(tok) {
  driveBusy = true; toast('Subiendo respaldo a Google Drive…');
  try {
    const folder = await driveFolder(tok), stamp = today();
    await driveFile(tok, folder, 'ControlPro_respaldo_' + stamp + '.json', jsonBlob());
    let xlsOk = true; try { await driveFile(tok, folder, 'ControlPro_' + stamp + '.xlsx', await buildXLS()); } catch (e) { if (e && e.status) throw e; xlsOk = false; }
    markBk('driveAt', { driveFolderId: folder }); driveBusy = false;
    toast(xlsOk ? 'Respaldo guardado en Google Drive ✓' : 'Respaldo (.json) guardado en Drive ✓');
  } catch (e) { driveErr(e); }
}
function bkBanner() {
  const at = lastBkAt(), days = at ? Math.floor((Date.now() - at) / 864e5) : null;
  if (days !== null && days < 7) return '';
  return `<div class="card mt ccrow" style="border-color:#1f3a5f"><div><b>${days === null ? 'Aún no tienes un respaldo' : 'Llevas ' + days + ' días sin respaldo'}</b><div class="lbl">Guarda una copia en tu Google Drive</div></div><button class="btn pri" type="button" data-act="drivebk" style="min-height:40px">Respaldar</button></div>`;
}
function openImport() {
  openPanel(`<div class="ph"><b>Importar respaldo</b><button class="ibtn" type="button" data-act="close" aria-label="Cerrar" style="border:0;background:none">${ic('x')}</button></div>
  <p class="hint" style="font-size:13px">Elige el archivo .json o pega el texto que copiaste con “📋 Copiar respaldo” en la app anterior.</p>
  <button class="btn wide mt" type="button" data-act="pickfile">${ic('up')} Elegir archivo</button>
  <label for="impTxt">O pega el texto aquí</label><textarea class="inp" id="impTxt" placeholder='{"viajes":[...]}'></textarea>
  <p class="hint" id="impMsg"></p><button class="btn wide pri mt" type="button" data-act="doimport">Importar</button>`);
}
async function doImport(text) {
  const msg = document.getElementById('impMsg'); let d;
  try { d = JSON.parse(text); } catch (e) { if (msg) { msg.style.color = 'var(--bad)'; msg.textContent = 'El texto no es un respaldo válido.'; } return; }
  let n = 0, skip = 0, ops = [];
  for (const c of COLS) for (const rec of (Array.isArray(d[c]) ? d[c] : [])) {
    if (!rec || !rec.id || typeof rec.id !== 'string' || rec.id.includes('/')) { skip++; continue; }
    const cur = S[c][rec.id];
    if (cur && num(cur.updatedAt) >= num(rec.updatedAt)) { skip++; continue; }
    const r = clean({ ...rec }); delete r.dev; if (!r.updatedAt) r.updatedAt = Date.now();
    ops.push([c, r]); n++;
  }
  for (let i = 0; i < ops.length; i += 400) { const b = F.writeBatch(fs); ops.slice(i, i + 400).forEach(([c, r]) => { b.set(docRef(c, r.id), r); S[c][r.id] = r; }); b.commit().catch(e => toast('Error al subir: ' + (e.code || e.message))); }
  closeSheet(); toast(`Importados ${n} registros${skip ? ' · ' + skip + ' ya estaban al día' : ''}`);
}

/* ---------- Eventos ---------- */
let tt; function toast(t, fn, label = 'Deshacer') { const el = document.getElementById('toast'); document.getElementById('toastTxt').textContent = t; const b = document.getElementById('toastBtn'); b.textContent = label; b.style.display = fn ? '' : 'none'; b.onclick = () => { fn && fn(); el.classList.remove('on'); }; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 5000); }
const kindOf = (c, r) => c === 'viajes' ? (isG(r) ? 'gasto' : st(r) === 'cancelado' ? 'recoger' : 'viaje') : c;
let logoutArm = false;
document.addEventListener('click', async e => {
  const b = e.target.closest('button,[data-go]'); if (!b) return;
  const d = b.dataset;
  if (d.go) { tab = d.go; try { localStorage.setItem('cp_tab', tab); } catch (x) {} closeIfOpen(); render(); scrollTo(0, 0); return; }
  if (d.new) { openForm(d.new); return; }
  if (d.edit) { const i = d.edit.indexOf('/'), c = d.edit.slice(0, i), id = d.edit.slice(i + 1); if (S[c][id]) openForm(kindOf(c, S[c][id]), id); return; }
  if (d.entregar) { if (S.viajes[d.entregar]) openForm('viaje', d.entregar); return; }
  if (d.ppay) { form.ppay = d.ppay; try { localStorage.setItem('cp_ppay', d.ppay); } catch (x) {} updForm(); return; }
  if (d.pay) { form.pay = d.pay; try { localStorage.setItem('cp_pay', d.pay); } catch (x) {} updForm(); return; }
  if (d.venc) { if (S.venc[d.venc]) openVenc(d.venc); return; }
  if (d.vchip) { document.getElementById('v_nombre').value = d.vchip; return; }
  if (d.chip) { document.getElementById('f_lugar').value = d.chip; document.getElementById('lugChips').innerHTML = lugChips(d.chip); updForm(); return; }
  if (d.fp) { fPay = d.fp; render(); return; }
  if (d.fall) { fAll = d.fall === '1'; render(); return; }
  if (d.per) { period = d.per; render(); return; }
  if (d.day) { const x = new Date(dayView + 'T12:00'); x.setDate(x.getDate() + +d.day); dayView = iso(x); render(); return; }
  switch (d.act) {
    case 'nuevo': openChooser(); break;
    case 'close': closeSheet(); break;
    case 'savemore': submitForm(true); break;
    case 'del': { if (!form.del) { form.del = true; b.textContent = 'Toca otra vez para eliminar'; return; } const c = FORMS[form.kind].c, prev = { ...S[c][form.id] }; save(c, { ...prev, deleted: true }); closeSheet(); toast('Registro eliminado', () => { const r = { ...prev }; delete r.deleted; save(c, r); }); break; }
    case 'cancelped': { if (!form.cancel) { form.cancel = true; b.textContent = 'Toca otra vez: el pedido se canceló'; return; } const prev = { ...S.viajes[form.id] }; save('viajes', { ...prev, estado: 'cancelado' }); closeSheet(); toast('Pedido cancelado · se registra la pérdida', () => save('viajes', { ...prev, estado: 'camino' })); break; }
    case 'hide': hideAmt = !hideAmt; try { localStorage.setItem('cp_hide', hideAmt ? '1' : '0'); } catch (x) {} render(); break;
    case 'vnew': openVenc(); break;
    case 'vsave': saveVenc(false); break;
    case 'vrenew': saveVenc(true); break;
    case 'vdel': { if (!form.del) { form.del = true; b.textContent = 'Toca otra vez para eliminar'; return; } const prev = { ...S.venc[form.id] }; save('venc', { ...prev, deleted: true }); closeSheet(); toast('Vencimiento eliminado', () => save('venc', { ...prev, deleted: false })); break; }
    case 'wa': sendWA(); break;
    case 'cobro': openCobro(); break;
    case 'csave': saveCobro(false); break;
    case 'cdel': saveCobro(true); break;
    case 'xls': exportXLS(); break;
    case 'json': exportJSON(); break;
    case 'drivebk': driveBackup(); break;
    case 'import': openImport(); break;
    case 'pickfile': document.getElementById('fileIn').click(); break;
    case 'doimport': doImport(document.getElementById('impTxt').value); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; render(); } break;
    case 'login': login(); break;
    case 'logout': if (!logoutArm) { logoutArm = true; b.textContent = 'Toca otra vez para cerrar sesión'; setTimeout(() => { logoutArm = false; }, 4000); return; } A.signOut(auth); break;
  }
});
function closeIfOpen() { if (document.getElementById('sheet').classList.contains('open')) { document.getElementById('sheet').classList.remove('open'); renderLock = false; form = null; } }
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('submit', e => { if (e.target.id === 'frm') { e.preventDefault(); submitForm(false); } else if (e.target.id === 'vfrm') { e.preventDefault(); saveVenc(false); } else if (e.target.id === 'cfrm') { e.preventDefault(); saveCobro(false); } });
document.addEventListener('input', e => { if (!form) return; if (e.target.id === 'f_lugar') { const c = document.getElementById('lugChips'); if (c) c.innerHTML = lugChips(e.target.value); } if (e.target.id === 'f_cobrado') form.cobEdited = e.target.value !== ''; if ((e.target.id || '').match(/^(f_|m_)/)) updForm(); });
document.addEventListener('change', e => {
  if (e.target.id === 'dayIn' && e.target.value) { dayView = e.target.value; render(); }
  if (e.target.id === 'fondoIn') { const dd = e.target.dataset.d, v = e.target.value === '' ? 0 : num(e.target.value); if (v === fondoOf(dd)) return; save('fondos', { ...(S.fondos[dd] || {}), id: dd, fecha: dd, monto: v }); toast('Fondo fijo guardado'); }
  if (e.target.id === 'fileIn' && e.target.files[0]) { const fr = new FileReader(); fr.onload = () => doImport(String(fr.result)); fr.readAsText(e.target.files[0]); e.target.value = ''; }
});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });

/* ---------- Sesión ---------- */
async function login() {
  const btn = document.getElementById('loginBtn'); if (btn) { btn.disabled = true; btn.lastChild.textContent = ' Abriendo Google…'; }
  const prov = new A.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(display-mode: standalone)').matches;
  try { if (mobile && /netlify\.app$/.test(location.hostname)) { await A.signInWithRedirect(auth, prov); return; } await A.signInWithPopup(auth, prov); }
  catch (e) { loginError(e); }
}
function loginError(e) {
  {
    const c = e.code || '';
    const m = c === 'auth/unauthorized-domain' ? 'Este dominio no está autorizado. En Firebase → Authentication → Configuración → Dominios autorizados, agrega ' + location.hostname + '.'
      : c === 'auth/network-request-failed' ? 'Necesitas internet para iniciar sesión la primera vez.'
      : c === 'auth/popup-blocked' ? 'El navegador bloqueó la ventana de Google. Permite ventanas emergentes e intenta de nuevo.'
      : c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? 'Se cerró la ventana de Google antes de terminar.'
      : c === 'auth/redirect-uri-mismatch' || /redirect_uri/.test(e.message || '') ? 'Falta autorizar la dirección de regreso en Google Cloud (ver instrucciones).'
      : 'No se pudo iniciar sesión (' + (c || e.message) + ').';
    lastErr = m; if (!user) document.getElementById('app').innerHTML = vLogin(m);
  }
}
let lastErr = '';
A.getRedirectResult(auth).then(res => {
  if (!res || sessionStorage.getItem('cp_drive_pending') !== '1') return;
  sessionStorage.removeItem('cp_drive_pending');
  const cred = A.GoogleAuthProvider.credentialFromResult(res);
  if (cred && cred.accessToken) { keepToken(cred.accessToken); const go = () => { if (user && COLS.every(c => meta[c].got)) driveUpload(cred.accessToken); else setTimeout(go, 400); }; go(); }
}).catch(e => { if (sessionStorage.getItem('cp_drive_pending') === '1') { sessionStorage.removeItem('cp_drive_pending'); driveErr(e); } else if (e && e.code) loginError(e); });
A.onAuthStateChanged(auth, u => {
  user = u;
  if (!u) { unsubs.forEach(x => x()); unsubs = []; COLS.forEach(c => { S[c] = {}; }); document.getElementById('app').innerHTML = vLogin(lastErr); return; }
  subscribe(); render();
  if (navigator.onLine) setTimeout(() => loadGIS().catch(() => {}), 1500);
});

/* ---------- Funcionar sin internet ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Nueva versión disponible', () => w.postMessage('skipWaiting'), 'Actualizar'); }); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
